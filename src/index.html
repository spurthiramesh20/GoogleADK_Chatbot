<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>iGOT Support Bot</title>
    <style>
        body {
            font-family: "Segoe UI", sans-serif;
            background: #eef2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .chat-container {
            width: 420px;
            height: 600px;
            background: #ffffff;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .header {
            padding: 15px;
            background: #1e40af;
            color: white;
            font-weight: bold;
            text-align: center;
            border-radius: 12px 12px 0 0;
        }

        .messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background: #f9fafb;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            margin-bottom: 10px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.4;
        }

        .user {
            background: #2563eb;
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }

        .bot {
            background: #e5e7eb;
            color: #111827;
            margin-right: auto;
            border-bottom-left-radius: 4px;
        }

        .input-area {
            display: flex;
            padding: 10px;
            border-top: 1px solid #ddd;
            gap: 8px;
        }

        textarea {
            flex: 1;
            resize: none;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
            height: 40px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 18px;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">iGOT Support Bot</div>

    <div class="messages" id="messages">
        <div class="message bot">
            Hi 👋 I can help with iGOT login, course access, or certificate issues.
        </div>
    </div>

    <div class="input-area">
        <textarea id="userInput" placeholder="Type your message..."></textarea>
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
const input = document.getElementById("userInput");
const messagesDiv = document.getElementById("messages");

input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});

async function sendMessage() {
    const message = input.value.trim();
    if (!message) return;

    messagesDiv.innerHTML += `<div class="message user">${message}</div>`;
    input.value = "";

    messagesDiv.scrollTop = messagesDiv.scrollHeight;

    const response = await fetch("/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ message })
    });

    const data = await response.json();
    messagesDiv.innerHTML += `<div class="message bot">${data.reply}</div>`;
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
}
</script>

</body>
</html>
